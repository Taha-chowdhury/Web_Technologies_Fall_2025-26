<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <link rel="stylesheet" href="lab_final.css">
</head>
 
<body>
     
     <script src="lab_final.js"></script>
    
<div class="container">
    <h2>Registration Form</h2> 
 
    <form id="regForm">
 
        <label>Full Name:</label>
        <input type="text" id="name">
        <div id="nameErr" class="error"></div>
 
        <label>Email:</label>
        <input type="email" id="email">
        <div id="emailErr" class="error"></div>
        
 
        <label>Company / Institution:</label>
        <input type="text" id="company">
        <div id="CErr" class="error"></div>

 
        <label>Attendance Type:</label><br>
        <input type="radio" name="attend" value="Virtual"> Virtual  
        <input type="radio" name="attend" value="In-Person"> In-Person
        <div id="attendErr" class="error" style="margin-top: 5px;"></div>
 
        <button type="button" class="btn" onclick="handleSubmit()">Register</button>
 
    </form>
 
    <hr>
 
    <button class="btn" id="statsBtn" onclick="toggleStats()">Show Event Analytics</button>
 
    <div id="statsPanel">
        <h3>Event Analytics</h3>
        <p>Total Registrants: <span id="totalReg">0</span></p>
        <p>Virtual: <span id="virtualCount">0</span></p>
        <p>In-Person: <span id="inCount">0</span></p>
    </div>
 
</div>
</body>
</html>
